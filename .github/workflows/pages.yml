name: 发布文档站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lec-space/liquidglass build
      - run: pnpm --filter @lec-space/liquidglass-docs build
        env:
          DOCS_BASE_PATH: /liquidglass/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/client
      - name: 部署站点
        id: deployment
        uses: actions/deploy-pages@v4
